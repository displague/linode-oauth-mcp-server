name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint with Ruff
        run: uv run ruff check --output-format=github src tests

      - name: Check formatting with Ruff
        run: uv run ruff format --check src tests

      - name: Type check with ty
        run: uv run ty check --output-format=github src

      - name: Test with pytest
        run: uv run pytest tests/ --cov=src --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        continue-on-error: true
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  validate-config:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        
    - name: Validate configuration
      run: |
        python -c "from linode_oauth_mcp_server.config import Config; Config.load()"
        echo "✅ Packaged configuration is valid"

    - name: Check spec manager setup
      run: |
        python -c "
        from linode_oauth_mcp_server.config import Config
        from linode_oauth_mcp_server.spec_manager import SpecManager
        config = Config.load()
        manager = SpecManager(config)
        assert config.get_api_names() == ['linode']
        print('SpecManager initialization successful')
        "
