name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint with Ruff
        run: uv run ruff check --output-format=github src tests

      - name: Check formatting with Ruff
        run: uv run ruff format --check src tests

      - name: Type check with ty
        run: uv run ty check --output-format=github src

      - name: Test with pytest
        run: uv run pytest tests/ --cov=src

  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Validate configuration
        run: |
          uv run python -c "from linode_oauth_mcp_server.config import Config; Config.load()"
          echo "✅ Packaged configuration is valid"

      - name: Check spec manager setup
        run: |
          uv run python -c "
          from linode_oauth_mcp_server.config import Config
          from linode_oauth_mcp_server.spec_manager import SpecManager
          config = Config.load()
          manager = SpecManager(config)
          assert config.get_api_names() == ['linode']
          print('SpecManager initialization successful')
          "

  lint-arazzo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Rules come from .spectral.yaml (spectral:arazzo). Lints the workflows
      # listed under workflows: in apis.yaml.
      - name: Lint Arazzo workflows with Spectral
        uses: stoplightio/spectral-action@v0.8.13
        with:
          file_glob: "src/linode_oauth_mcp_server/data/config/*.arazzo.yaml"
