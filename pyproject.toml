[project]
name = "linode-oauth-mcp-server"
dynamic = ["version"]
description = "Linode API v4 MCP server with per-tool OAuth scopes and in-client sign-in"
authors = [{ name = "Marques Johansson" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
keywords = ["linode", "mcp", "model-context-protocol", "oauth", "openapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "fastmcp~=4.1.0",
    "mcp-types",
    "httpx2>=2.5.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "click>=8.0.0",
    "jq>=1.6.0",
    "platformdirs>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff==0.17.1",
    "ty==0.0.89",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/displague/linode-oauth-mcp-server"
Issues = "https://github.com/displague/linode-oauth-mcp-server/issues"

[project.scripts]
linode-oauth-mcp-server = "linode_oauth_mcp_server.main:main"

[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["linode_oauth_mcp_server*"]

[tool.setuptools.package-data]
linode_oauth_mcp_server = ["data/config/*.yaml"]

[tool.setuptools_scm]
# Untagged builds get a dev version; a v1.2.3 tag builds 1.2.3.
fallback_version = "0.0.0"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# pycodestyle errors, pyflakes, import sorting, pyupgrade, bugbear.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
