[project]
name = "linode-rfc9727-mcp-server"
version = "0.1.0"
description = "Linode API v4 OpenAPI MCP server with cached specifications"
authors = [{ name = "Akamai RFC 9727 MCP Server contributors" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "fastmcp==4.0.0b1",
    "fastmcp-slim==4.0.0b1",
    "mcp-types",
    "httpx2>=2.5.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "click>=8.0.0",
    "jq>=1.6.0",
    "platformdirs>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
linode-rfc9727-mcp-server = "linode_rfc9727_mcp_server.main:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["linode_rfc9727_mcp_server*"]

[tool.setuptools.package-data]
linode_rfc9727_mcp_server = ["data/config/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
